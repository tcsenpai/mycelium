name: Publish to crates.io

# Publishes the crates to crates.io on a version tag. mycelium-core must be
# published BEFORE mycelium-manager (myc depends on it), and myc must wait for
# the new core version to appear in the crates.io index before it can build.
#
# Requires the CARGO_REGISTRY_TOKEN repository secret (crates.io API token).
# Manual trigger (workflow_dispatch) is also allowed so a failed core-vs-myc
# race can be re-run without re-tagging.
#
# This workflow shares the `v*` trigger with release.yml, which builds the MycUI
# desktop bundles. Changes confined to mycui/ (excluded from the crate) need a
# tag to ship the app but must not force a crate release, so the preflight below
# skips publishing entirely when both crate versions are already on crates.io.
# Set the `force_publish` input on a manual run to publish regardless.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish even if the version is already on crates.io"
        type: boolean
        default: false

jobs:
  publish:
    name: cargo publish (core, then myc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Decide up front whether there is anything to publish. Asking the sparse
      # index is authoritative and cheap; the alternative is inferring it from
      # the text of a cargo publish failure, which breaks if crates.io reworks
      # its error strings.
      - name: Check whether these versions are already published
        id: preflight
        run: |
          set -euo pipefail

          crate_version() {
            grep -m1 '^version' "$1" | sed -E 's/version = "([^"]+)"/\1/'
          }

          # Sparse-index paths shard on name length: 1/2/3 chars get special
          # prefixes, 4+ use the first two pairs of characters.
          index_path() {
            name="$1"
            case ${#name} in
              1) echo "1/$name" ;;
              2) echo "2/$name" ;;
              3) echo "3/${name:0:1}/$name" ;;
              *) echo "${name:0:2}/${name:2:2}/$name" ;;
            esac
          }

          published() {
            name="$1"; ver="$2"
            url="https://index.crates.io/$(index_path "$name")"
            # A brand-new crate 404s; treat that as "not published".
            body=$(curl -sf "$url") || return 1
            echo "$body" | grep -q "\"vers\":\"${ver}\""
          }

          core_ver=$(crate_version mycelium-core/Cargo.toml)
          myc_ver=$(crate_version Cargo.toml)
          echo "core version: $core_ver"
          echo "myc version:  $myc_ver"

          core_done=false; myc_done=false
          published mycelium-manager-core "$core_ver" && core_done=true
          published mycelium-manager "$myc_ver" && myc_done=true
          echo "core already published: $core_done"
          echo "myc already published:  $myc_done"

          forced="${{ github.event.inputs.force_publish || 'false' }}"
          if [ "$core_done" = true ] && [ "$myc_done" = true ] && [ "$forced" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::core $core_ver and myc $myc_ver are already on crates.io; skipping publish. This is expected for tags that only ship MycUI. Bump the versions, or re-run with force_publish, to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish mycelium-manager-core
        if: steps.preflight.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -o pipefail  # so the pipe's exit reflects cargo, not tee
          if cargo publish -p mycelium-manager-core 2>&1 | tee /tmp/core.log; then
            echo "core published"
          elif grep -q "already exists" /tmp/core.log; then
            echo "core version already on crates.io — continuing"
          else
            echo "core publish failed" >&2
            exit 1
          fi

      - name: Wait for mycelium-manager-core in the sparse index
        if: steps.preflight.outputs.skip != 'true'
        run: |
          # cargo publish resolves deps from the SPARSE index (index.crates.io),
          # which updates within ~a minute — much faster/more reliable than the
          # `cargo search` API. Poll that directly for the just-published version.
          ver=$(grep -m1 '^version' mycelium-core/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          for i in $(seq 1 30); do
            if curl -sf "https://index.crates.io/my/ce/mycelium-manager-core" \
                 | grep -q "\"vers\":\"${ver}\""; then
              echo "core ${ver} is in the sparse index"
              exit 0
            fi
            echo "waiting for core ${ver} in sparse index ($i/30)..."
            sleep 10
          done
          echo "core did not appear in the sparse index in time" >&2
          exit 1

      - name: Publish mycelium-manager (myc)
        if: steps.preflight.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -o pipefail
          # Retry a few times: even after the index shows core, cargo may briefly
          # fail to resolve it. Tolerate an already-published version.
          for attempt in 1 2 3 4 5; do
            if cargo publish -p mycelium-manager 2>&1 | tee /tmp/myc.log; then
              echo "myc published"; exit 0
            elif grep -q "already exists" /tmp/myc.log; then
              echo "myc version already on crates.io — nothing to do"; exit 0
            elif grep -q "no matching package" /tmp/myc.log; then
              echo "core not yet resolvable, retrying ($attempt/5)..."; sleep 20
            else
              echo "myc publish failed" >&2; exit 1
            fi
          done
          echo "myc publish failed after retries" >&2; exit 1
