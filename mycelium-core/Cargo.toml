[package]
name = "mycelium-manager-core"
version = "0.3.0"
edition = "2021"
authors = ["Mycelium Contributors"]
description = "Shared data layer (db, models, migrations, errors) for the Mycelium task manager"
license = "MIT"
repository = "https://github.com/tcsenpai/mycelium"
rust-version = "1.75"

# The crates.io package name is `mycelium-manager-core` (mycelium-core /
# mycelium_core were already taken on crates.io). The LIBRARY name stays
# `mycelium_core` so `use mycelium_core::...` in the CLI and MycUI is unchanged.
[lib]
name = "mycelium_core"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
regex = "1.11"
