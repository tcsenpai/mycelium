[workspace]
members = ["mycelium-core"]

[package]
name = "mycelium-manager"
version = "0.2.10"
edition = "2021"
authors = ["Mycelium Contributors"]
description = "A robust, production-grade task/plan manager CLI (binary: myc)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tcsenpai/mycelium"
homepage = "https://github.com/tcsenpai/mycelium"
documentation = "https://docs.rs/mycelium-manager"
keywords = ["cli", "task-manager", "project-management", "productivity", "agent"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.75"
exclude = [
    ".mycelium/*",
    ".planning/*",
    ".serena/*",
    ".claude/*",
    ".mcp_data/*",
    ".bank",
    "mycui/*",
    "tests/fixtures/*",
    "PROJECT_INDEX.*",
    "ADDITIONAL.md",
    "PUBLISHING.md",
    "publish.sh",
    "AGENTS.md",
    "install.sh",
]

[[bin]]
name = "myc"
path = "src/main.rs"

[dependencies]
mycelium-manager-core = { path = "mycelium-core", version = "0.2.1" }
clap = { version = "4.5", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
directories = "5.0"
colored = "2.1"
comfy-table = "7.1"
regex = "1.11"
url = "2.5"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "blocking"] }
sha2 = "0.10"
csv = "1.3"

[dev-dependencies]
tempfile = "3.14"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
